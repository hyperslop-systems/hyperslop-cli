on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  goreleaser-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: git fetch --force --tags
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install arm64 cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - name: Read GoReleaser build license from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: https://vault.yolo.scapegoat.dev
          method: jwt
          path: github-actions
          role: release-hyperslop-cli-builder
          jwtGithubAudience: https://vault.yolo.scapegoat.dev
          secrets: |
            kv/data/ci/release/shared/goreleaser-pro license_key | GORELEASER_KEY ;
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser-pro
          version: "~> v2"
          args: release --clean --split
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_KEY: ${{ env.GORELEASER_KEY }}
          GGOOS: linux
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist

  goreleaser-darwin:
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: git fetch --force --tags
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Read GoReleaser build license from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: https://vault.yolo.scapegoat.dev
          method: jwt
          path: github-actions
          role: release-hyperslop-cli-builder
          jwtGithubAudience: https://vault.yolo.scapegoat.dev
          secrets: |
            kv/data/ci/release/shared/goreleaser-pro license_key | GORELEASER_KEY ;
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser-pro
          version: "~> v2"
          args: release --clean --split
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_KEY: ${{ env.GORELEASER_KEY }}
          GGOOS: darwin
      - uses: actions/upload-artifact@v4
        with:
          name: dist-darwin
          path: dist

  goreleaser-merge:
    needs:
      - goreleaser-linux
      - goreleaser-darwin
    permissions:
      contents: write
      id-token: write
    uses: go-go-golems/infra-tooling/.github/workflows/publish-goreleaser-release.yml@main
    with:
      linux_artifact: dist-linux
      darwin_artifact: dist-darwin
      goreleaser_config: .goreleaser.yaml
      credential_profile: hyperslop-homebrew-fury-gpg
      vault_role: release-hyperslop-cli-publisher
