name: golang-pipeline

on:
  push:
    branches:
      - 'main'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-private-go
      - run: git fetch --force --tags
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      -
        name: Verify logcopter package loggers
        run: make logcopter-check
      -
        name: Generate assets
        run: go generate ./...
      -
        name: Verify generated files are up to date
        run: git diff --exit-code
      -
        name: Run unit tests
        run: go test ./...
      -
        name: Verify hyperslop-cli never imports the datalab server (no import cycle)
        run: |
          if go list -deps ./... 2>/dev/null | grep -Eq '^github\.com/hyperslop-systems/datalab(/|$)'; then
            echo "FAIL: hyperslop-cli depends on hyperslop-systems/datalab (import cycle with the server)"
            go list -deps ./... | grep -E '^github\.com/hyperslop-systems/datalab(/|$)'
            exit 1
          fi
          echo "OK: hyperslop-cli has no dependency on hyperslop-systems/datalab"
